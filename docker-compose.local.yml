# Local / LAN run — e.g. the ESP32 scale demo. No Traefik, no external network.
# Publishes on 0.0.0.0:3000 (reachable from other devices on the LAN) and runs
# its own PostgreSQL, keeping the cluster on the host (./data/postgres). The
# production stack lives in the separate server repo.
#
#   docker compose -f docker-compose.local.yml up -d --build
#
# Requires .env.docker with BETTER_AUTH_SECRET and BETTER_AUTH_URL set to
# http://<this-host-LAN-IP>:3000 (see .env.example). Migrations run on start.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spoolhouse
      POSTGRES_PASSWORD: spoolhouse
      POSTGRES_DB: spoolhouse
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spoolhouse -d spoolhouse"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: runner
    image: spoolhouse:local
    restart: unless-stopped
    env_file: .env.docker
    environment:
      # Not reachable from outside the compose network, so the fixed password
      # is fine for a LAN demo.
      DATABASE_URL: postgres://spoolhouse:spoolhouse@db:5432/spoolhouse
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
