; Spoolhouse scale firmware — ESP32 "Cheap Yellow Display" (ESP32-2432S028R)
; TFT + touch use the board's stock wiring (TFT on the HSPI peripheral, its
; native 13/12/14 pins). VSPI (23/19/18) is left to the NFC reader, which
; shares the bus with the on-board SD slot.

[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Two ~1.9 MB OTA app slots (+ tiny SPIFFS) so over-the-air / browser firmware
; updates work — they flash the inactive slot then switch. (huge_app has only
; ONE app slot and therefore cannot do OTA.) The ~1.2 MB image fits with room.
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bogde/HX711@^0.7.5
    adafruit/Adafruit PN532@^1.3.4
    https://github.com/iwanders/MFRC630.git
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    https://github.com/tzapu/WiFiManager.git

build_flags =
    ; ---- TFT_eSPI: stock CYD (ILI9341, landscape-capable 240x320) ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DUSE_HSPI_PORT=1        ; keep VSPI free for the NFC reader
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    ; 40 MHz (down from 55) for panel stability: at higher clocks the ILI9341 —
    ; which has no wired reset line on the CYD — can desync on a glitch and blank
    ; to white while the ESP32 keeps running. 40 MHz is the reliable CYD value.
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSPI_TOUCH_FREQUENCY=2500000
    ; XPT2046 touch controller (stock wiring, unused for now)
    -DTOUCH_CS=33
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1

; Wireless flashing over WiFi (ArduinoOTA) — no USB / case disassembly needed

; once a USB-flashed build already has OTA support running on the device.
;   pio run -e cyd_ota -t upload
; The OTA password is read from include/secrets.h by ota_auth.py automatically.
; If mDNS is flaky, add: --upload-port 192.168.1.184
[env:cyd_ota]
extends = env:cyd
upload_protocol = espota
upload_port = spoolhouse-scale.local
extra_scripts = post:ota_auth.py
