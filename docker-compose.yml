# Spoolhouse app stack. Traefik (see deploy/traefik/) terminates TLS and routes
# spoolhouse.felixkratz.de to this service over the shared external "web" network.
services:
  app:
    build:
      context: .
      target: runner
    image: spoolhouse
    restart: unless-stopped
    env_file: .env
    environment:
      # DB lives on the named volume, not the image.
      DATABASE_PATH: /data/spoolhouse.db
    volumes:
      - spoolhouse-data:/data
    networks:
      - web
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.spoolhouse.rule=Host(`spoolhouse.felixkratz.de`)
      - traefik.http.routers.spoolhouse.entrypoints=websecure
      - traefik.http.routers.spoolhouse.tls.certresolver=le
      - traefik.http.services.spoolhouse.loadbalancer.server.port=3000

  # One-off tools (admin bootstrap, future tsx scripts). Not started by `up`.
  # Uses the builder stage (full deps + source + tsx) against the same DB volume.
  #   docker compose run --rm admin <email> "<Full Name>"
  admin:
    build:
      context: .
      target: builder
    image: spoolhouse-tools
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_PATH: /data/spoolhouse.db
    volumes:
      - spoolhouse-data:/data
    entrypoint: ["npx", "tsx", "scripts/create-admin.ts"]

volumes:
  spoolhouse-data:

networks:
  web:
    external: true
