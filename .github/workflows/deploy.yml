name: Build and Deploy Spoolhouse

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # Converts repository name to lowercase safely
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/spoolhouse

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Set up Docker Buildx for faster caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build and push the main application runtime image (runner target)
      - name: Build and push App Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.IMAGE_BASE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BETTER_AUTH_URL=https://localhost:3000

      # 2. Build and push the tools image (builder target for admin tasks)
      - name: Build and push Tools Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: builder
          push: true
          tags: ${{ env.IMAGE_BASE }}-tools:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BETTER_AUTH_URL=https://localhost:3000

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Navigate to where your docker-compose.yml lives on Hetzner
            cd $STACK_DIR

            # Authenticate Docker with GHCR using the token if not already cached
            # (Ensure you ran `docker login ghcr.io` once on the server manually)

            # Pull down the newly pushed images
            docker compose pull

            # Relaunch the application with zero downtime
            docker compose up -d --remove-orphans

            # Clean up old images to keep your Hetzner disk clear
            docker image prune -f
