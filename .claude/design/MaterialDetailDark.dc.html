<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spoolhouse · Material Galaxy Black (dark)</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./spoolhouse.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#071117}</style>
</helmet>
<div style="min-height: 100vh; background: #071117">
<dc-import name="MaterialDetail" dark="{{ true }}" status="{{status}}" hint-size="100%,1900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"status":{"editor":"enum","default":"pending","options":["approved","pending","rejected"]},"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
renderVals() {
return { status: this.props.status ?? 'pending' };
}
}
</script>
</body>
</html>
