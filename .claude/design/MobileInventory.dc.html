<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spoolhouse · Mobile inventory</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}
.app{--bg:#F7FBFC;--fg:#0D1C27;--card:#FFFFFF;--primary:#072D3D;--primary-fg:#F7FBFC;--muted:#E8F0F3;--muted-fg:#59656E;--accent:#007785;--accent-fg:#F8FDFE;--destructive:#E7000B;--destructive-fg:#FFFFFF;--border:#D6E0E3;--sidebar:#FAFCFD;--ink:#0D1C27;--sw-ring:rgba(13,28,39,.18);background:var(--bg);color:var(--fg);font-family:Geist,ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app.dark{--bg:#071117;--fg:#EEF3F4;--card:#0C1A22;--primary:#EEF3F4;--primary-fg:#0C1A22;--muted:#18262E;--muted-fg:#8D9BA3;--accent:#0F919C;--accent-fg:#020B0F;--destructive:#FF6467;--destructive-fg:#1F0506;--border:rgba(255,255,255,.12);--sidebar:#0C1A22;--ink:rgba(238,243,244,.55);--sw-ring:rgba(255,255,255,.22)}
.app *{box-sizing:border-box}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted-fg)}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.kick{font:500 11px/1.2 'Geist Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-fg)}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 5px;border-radius:3px;font:600 10.5px/1 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--ink);color:var(--fg);white-space:nowrap}
.tag.low{background:var(--destructive);border-color:var(--destructive);color:var(--destructive-fg)}
.tag.acc{border-color:var(--accent);color:var(--accent)}
.tag.inv{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.ibtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:6px;border:0;background:transparent;color:var(--fg);cursor:pointer;flex:none;position:relative}
.logo{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--accent);color:var(--accent-fg);flex:none}
.logo .i{width:16px;height:16px;stroke-width:1.5}
.sw{display:inline-block;width:14px;height:14px;border-radius:999px;border:1px solid var(--sw-ring);box-shadow:inset 0 1px 2px rgba(0,0,0,.22);flex:none}
.peg{background-image:radial-gradient(circle,color-mix(in oklab,var(--fg) 11%,transparent) 1px,transparent 1.4px);background-size:18px 18px}
.meter{position:relative;height:10px;background:var(--muted);-webkit-mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px);mask:repeating-linear-gradient(90deg,#000 0 5px,transparent 5px 7px)}
.meter>i{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.meter.low>i{background:var(--destructive)}
.field{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid var(--ink);border-radius:6px;background:var(--card);color:var(--muted-fg)}
.field input{border:0;outline:0;background:transparent;font:15px Geist,sans-serif;color:var(--fg);width:100%;min-width:0}
.field input::placeholder{color:var(--muted-fg)}
.seg{display:flex;border:1px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--card)}
.seg button{flex:1;height:40px;border:0;border-left:1px solid var(--border);background:transparent;color:var(--muted-fg);font:500 11px 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--fg);color:var(--bg)}
.label{position:relative;background:var(--card);border:1px solid var(--ink);border-radius:4px}
.label::before{content:"";position:absolute;left:10px;top:21px;width:7px;height:7px;border-radius:50%;border:1px solid var(--ink);background:var(--bg)}
.mh{display:flex;align-items:center;gap:12px;padding:12px 12px 10px 26px;width:100%;border:0;background:transparent;color:inherit;font:inherit;text-align:left}
.perf{border-top:1px dashed var(--ink);opacity:.45}
.lname{font:600 19px/1 'Barlow Condensed',Geist,sans-serif;letter-spacing:.03em;text-transform:uppercase}
.sp{display:flex;flex-direction:column;gap:7px;padding:10px 0;border-top:1px solid var(--border)}
.sp:first-child{border-top:0}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:60px;color:var(--muted-fg);font:500 10px 'Geist Mono',monospace;letter-spacing:.06em;text-transform:uppercase;position:relative;text-decoration:none}
.bn.on{color:var(--fg)}
.bn.on .i{color:var(--accent)}
.bn.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:3px;background:var(--accent)}
.bdot{position:absolute;top:6px;left:50%;margin-left:4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font:600 10px/16px 'Geist Mono',monospace;text-align:center}
</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; display: flex; flex-direction: column">

<span style="font-size: 16px; font-weight: 600; letter-spacing: -0.03em; margin-left: 4px">Spoolhouse</span>
<button class="ibtn" aria-label="Notifications, 4 unread" style="margin-left: auto"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span style="position: absolute; top: 10px; right: 10px; width: 8px; height: 8px; border-radius: 999px; background: var(--accent); border: 2px solid var(--sidebar); box-sizing: content-box"></span></button>

<button class="ibtn" aria-label="Filters" style="border: 1px solid var(--ink); background: var(--card)"><svg class="i" viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px"><path d="M21 4h-7"/><path d="M10 4H3"/><path d="M21 12h-9"/><path d="M8 12H3"/><path d="M21 20h-5"/><path d="M12 20H3"/><path d="M14 2v4"/><path d="M8 10v4"/><path d="M16 18v4"/></svg></button>

<div class="sp"><div style="display: flex; align-items: center; gap: 8px"><span class="mono muted" style="font-size: 12px; width: 26px">#01</span><span class="mono" style="font-weight: 600; min-width: 58px">742 g</span><span class="tag inv">A2</span></div><div class="meter"><i style="width: 74%"></i></div></div>
<div class="sp"><div style="display: flex; align-items: center; gap: 8px"><span class="mono muted" style="font-size: 12px; width: 26px">#02</span><span class="mono" style="font-weight: 600; min-width: 58px">418 g</span><span class="tag inv">A2</span><span class="tag acc">Lent · Jonas</span></div><div class="meter"><i style="width: 42%"></i></div></div>
<div class="sp"><div style="display: flex; align-items: center; gap: 8px"><span class="mono muted" style="font-size: 12px; width: 26px">#03</span><span class="mono" style="font-weight: 600; min-width: 58px">1,000 g</span><span class="tag inv">A3</span></div><div class="meter"><i style="width: 100%"></i></div></div>
</div>

<button class="mh"><span class="sw" style="width: 28px; height: 28px; background: #F26B21"></span><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px"><span style="display: flex; align-items: center; gap: 8px"><span class="lname">Prusa Orange</span><span class="tag">PETG</span></span><span class="kick" style="letter-spacing: 0.05em">Prusament · 2 spools</span></span><span class="mono" style="font-family: 'Barlow Condensed', Geist, sans-serif; font-size: 26px; line-height: 0.95; font-weight: 600; letter-spacing: 0">741<small class="muted" style="font-size: 11px; margin-left: 2px">g</small></span></button>
<div class="perf"></div>
<div style="padding: 0 12px 2px">
<div class="sp"><div style="display: flex; align-items: center; gap: 8px"><span class="mono muted" style="font-size: 12px; width: 26px">#02</span><span class="mono" style="font-weight: 600; min-width: 58px">86 g</span><span class="tag inv">B1</span><span class="tag low">Low</span></div><div class="meter low"><i style="width: 9%"></i></div></div>
<div class="sp"><div style="display: flex; align-items: center; gap: 8px"><span class="mono muted" style="font-size: 12px; width: 26px">#03</span><span class="mono" style="font-weight: 600; min-width: 58px">655 g</span><span class="tag inv">B1</span></div><div class="meter"><i style="width: 66%"></i></div></div>
</div>
