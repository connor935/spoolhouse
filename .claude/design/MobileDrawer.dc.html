<style>
body{margin:0}
.app{--bg:#F7FBFC;--fg:#0D1C27;--card:#FFFFFF;--primary:#072D3D;--primary-fg:#F7FBFC;--muted:#E8F0F3;--muted-fg:#59656E;--accent:#007785;--accent-fg:#F8FDFE;--border:#D6E0E3;--sidebar:#FAFCFD;--sb-active:#E8F0F3;--sb-active-fg:#072D3D;background:var(--bg);color:var(--fg);font-family:Geist,ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app.dark{--bg:#071117;--fg:#EEF3F4;--card:#0C1A22;--primary:#EEF3F4;--primary-fg:#0C1A22;--muted:#18262E;--muted-fg:#8D9BA3;--accent:#0F919C;--accent-fg:#020B0F;--border:rgba(255,255,255,.12);--sidebar:#0C1A22;--sb-active:#18262E;--sb-active-fg:#EEF3F4}
.app *{box-sizing:border-box}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--muted-fg)}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-fg)}
.ibtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:8px;border:0;background:transparent;color:var(--fg);cursor:pointer;flex:none;text-decoration:none}
.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:7px;background:var(--accent);color:var(--accent-fg);flex:none}
.logo .i{width:18px;height:18px;stroke-width:1.5}
.nav{position:relative;display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:8px;color:var(--fg);font:400 15px/1 Geist,sans-serif;text-decoration:none}
.nav .i{color:var(--muted-fg)}
.nav.on{background:var(--sb-active);color:var(--sb-active-fg);font-weight:600}
.nav.on .i{color:var(--accent)}
.nav.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.nav.sub{height:40px;font-size:14px}
.pill{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font:600 11px/20px 'Geist Mono',monospace;text-align:center}
.cnt{margin-left:auto;font:500 12px/1 'Geist Mono',monospace;color:var(--muted-fg)}
.seg{display:flex;gap:2px;padding:3px;border-radius:8px;background:var(--muted)}
.seg button{flex:1;height:34px;border:0;border-radius:6px;background:transparent;color:var(--muted-fg);font:500 12px Geist,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 2px rgba(7,17,23,.12)}
.seg .i{width:14px;height:14px}
</style>
</helmet>
