<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Spoolhouse · Filters mobile sheet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./spoolhouse.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="{{themeClass}}" style="width: 390px; height: 844px; position: relative; overflow: hidden">
<div aria-hidden="true" style="padding: 70px 16px; display: flex; flex-direction: column; gap: 12px"><div class="ghost" style="height: 44px; width: 220px"></div><div class="ghost" style="height: 44px"></div><div class="ghost" style="height: 120px"></div></div>
<div class="toast" role="status" style="position: absolute; top: 14px; left: 16px; right: 16px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Filters applied · 6 spools</div>
<a href="CatalogMobile.dc.html" class="scrim" aria-label="Close filters" style="position: absolute; inset: 0; top: 70px"></a>
<div role="dialog" aria-labelledby="fm" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 2px solid var(--ink); border-radius: 14px 14px 0 0; padding: 10px 18px 22px; display: flex; flex-direction: column; gap: 18px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: var(--border)"></span>
<div style="display: flex; align-items: center; justify-content: space-between"><h2 id="fm" class="h2" style="font-size: 28px">Filters</h2><button class="btn btn-ghost btn-sm">Clear all</button></div>
<div class="field"><span class="lab"><span style="display: flex; align-items: center; gap: 6px"><span class="dot"></span>Filament type</span></span><div style="display: flex; gap: 6px; flex-wrap: wrap"><button class="tag fill" style="height: 32px; padding: 0 10px">PLA</button><button class="tag fill" style="height: 32px; padding: 0 10px">PETG</button><button class="tag" style="height: 32px; padding: 0 10px">ABS</button><button class="tag" style="height: 32px; padding: 0 10px">ASA</button><button class="tag" style="height: 32px; padding: 0 10px">TPU</button></div></div>
<div class="field"><span class="lab">Min. remaining (g)</span><label class="inp r" style="height: 44px"><input placeholder="e.g. 300" inputmode="numeric" aria-label="Minimum remaining"><span class="unit">g</span></label></div>
<div class="field"><span class="lab"><span style="display: flex; align-items: center; gap: 6px"><span class="dot"></span>Density</span><span class="kick">g/cm³</span></span><div style="display: flex; gap: 8px; align-items: center"><label class="inp r" style="height: 44px"><input value="1.20" aria-label="Density min"></label><span class="muted">–</span><label class="inp r" style="height: 44px"><input value="1.30" aria-label="Density max"></label></div></div>
<div class="field"><span class="lab">Extruder temp <span class="kick">°C</span></span><div style="display: flex; gap: 8px; align-items: center"><label class="inp r" style="height: 44px"><input placeholder="min" aria-label="Extruder temp min"></label><span class="muted">–</span><label class="inp r" style="height: 44px"><input placeholder="max" aria-label="Extruder temp max"></label></div></div>
<button class="btn btn-acc btn-lg" style="width: 100%">Show 6 spools</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { themeClass: (this.props.dark ?? false) ? 'app dark' : 'app' };
}
}
</script>
</body>
</html>
