# Shared Traefik reverse proxy. Runs once on the box; every app (Spoolhouse and
# future ones) attaches to the external "web" network and adds its own Host()
# router labels. TLS via Let's Encrypt HTTP-01 (a cert per hostname, no DNS API).
#
# One-time setup before `up` (see ./README.md):
#   docker network create web
#   touch acme.json && chmod 600 acme.json
#   set ACME_EMAIL in .env (this dir)
services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      # Logging (default level is ERROR — INFO shows startup + cert issuance)
      - --log.level=INFO
      # Providers
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=web
      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Global HTTP -> HTTPS redirect
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      # Let's Encrypt (HTTP-01 challenge solved on the :80 entrypoint)
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?set ACME_EMAIL in .env}
      - --certificatesresolvers.le.acme.storage=/acme.json
      # Uncomment while testing to avoid Let's Encrypt rate limits:
      # - --certificatesresolvers.le.acme.caserver=https://acme-staging-v02.api.letsencrypt.org/directory
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./acme.json:/acme.json
    networks:
      - web

networks:
  web:
    external: true
